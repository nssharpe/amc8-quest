<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Art Preview — AMC 8 Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #131530; color: #eef0ff; font-family: "Nunito", sans-serif; padding: 1.5rem 1rem 4rem; }
  h1 { font-family: "Fredoka", sans-serif; text-align: center; font-size: 1.8rem; }
  p.sub { text-align: center; color: #aab0e0; font-weight: 700; margin: .4rem 0 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; max-width: 1000px; margin: 0 auto; }
  .cell { background: #1f2148; border: 2px solid #3a3d75; border-radius: 18px; padding: .8rem; text-align: center; }
  .cell img { width: 100%; max-width: 150px; }
  .cell.light { background: #ffffff; border-color: #d5d5e0; }
  .cell .n { font-family: "Fredoka", sans-serif; font-weight: 600; margin-top: .3rem; }
  .cell.light .n { color: #26324e; }
  .cell .lv { font-size: .75rem; color: #aab0e0; font-weight: 800; }
  .cell.light .lv { color: #667; }
  h2 { font-family: "Fredoka", sans-serif; text-align: center; margin: 2.2rem 0 1rem; font-size: 1.3rem; color: #ffd21f; }
  .row { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
  .row img.sm { width: 44px; } .row img.md { width: 96px; }
</style>
</head>
<body>
  <h1>🐾 Pet evolutions — draft</h1>
  <p class="sub">10 stages · unlock levels 1, 3, 6, 10, 15, 21, 28, 36, 45, 55 · dragon includes Nate's tweaks</p>
  <div id="all"></div>
  <h2>Small sizes (dashboard bubble / player cards)</h2>
  <div id="smalls"></div>
<script>
  const PETS = ["dragon","unicorn","robot","cat","fox","shark","dino","penguin"];
  const NAMES = ["Egg","Hatchling","Kid","Scrapper","Champion","Hero","Mega","Ultra","Mythic","LEGENDARY"];
  const LEVELS = [1,3,6,10,15,21,28,36,45,55];
  const all = document.getElementById("all"), smalls = document.getElementById("smalls");
  for (const pet of PETS) {
    all.insertAdjacentHTML("beforeend", `<h2>${pet[0].toUpperCase() + pet.slice(1)}</h2>`);
    const g = document.createElement("div"); g.className = "grid";
    for (let i = 0; i < 10; i++) {
      const cls = i >= 5 ? "cell light" : "cell"; // show later stages on white too? alternate: even rows dark
      g.insertAdjacentHTML("beforeend",
        `<div class="cell"><img src="assets/pets/${pet}/stage${i}.svg?v=5"><div class="n">${i}. ${NAMES[i]}</div><div class="lv">level ${LEVELS[i]}+</div></div>`);
    }
    all.appendChild(g);
    const g2 = document.createElement("div"); g2.className = "grid";
    for (let i = 0; i < 10; i++) {
      g2.insertAdjacentHTML("beforeend",
        `<div class="cell light"><img src="assets/pets/${pet}/stage${i}.svg?v=5"><div class="n">${i}. ${NAMES[i]}</div><div class="lv">on white</div></div>`);
    }
    const det = document.createElement("details");
    det.innerHTML = "<summary style='cursor:pointer;color:#aab0e0;font-weight:800;margin:.4rem 0'>show on white (problem card)</summary>";
    det.appendChild(g2);
    all.appendChild(det);
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<b style="width:90px;font-family:Fredoka">${pet}</b>` +
      Array.from({length: 10}, (_, i) => `<img class="sm" src="assets/pets/${pet}/stage${i}.svg?v=5">`).join("");
    smalls.appendChild(row);
  }
</script>
</body>
</html>
